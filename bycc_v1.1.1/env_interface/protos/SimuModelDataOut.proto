// 对单个目标的ZC结果
message sReconResult {
  int32 ReconID = 1;// ZC设备ID
  int32 TargetID = 2;// 雷达ID
  int32 ESMType = 3;// 接收机类型，RWR/ESM/HGESM，或者是接收机类型
  bool bReconed = 4;// 是否ZC到
  bool bIsInFrequenceRange = 5;// 是否满足频段要求
  bool bIsInAzVision = 6;// 是否满足方位视场
  bool bIsInELVision = 7;// 是否满足俯仰视场，bUseOTH为false时有效
  bool bIsInLOS = 8;// 是否满足视距视场，bUseOTH为false时有效
  bool bIsTerrainVisible = 9;// 是否满足地形通视
  bool bIsInSensity = 10;// 是否满足灵敏度要求
  bool bIsInParaMeasRng = 11;// 是否满足参数测量范围要求 add202509
  bool bIsSignalRecognise = 12;// 信号能否识别
  float AZ = 13;// 目标方位
  float EL = 14;// 目标俯仰
  float DIS = 15;// 目标距离，display
  float ReconMaxRange = 16;// 对目标最大ZC距离，display
  float DOAError = 17;// 侧向误差，ZC到有效
