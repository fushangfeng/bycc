[tool.black]
line-length = 88
exclude = '''
/(
    drill/
)/
'''

[tool.isort]
src_paths = ["bycc", "tests"]
extra_standard_library = ["typing_extensions"]
skip_gitignore = true
skip_glob = ["drill/*"]
skip = ["__init__.py"]  # fixme: circular import error
atomic = true
profile = "black"
indent = 4
line_length = 88
lines_after_imports = 2
multi_line_output = 3
include_trailing_comma = true
combine_as_imports = true

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning:bycc.*:"]
